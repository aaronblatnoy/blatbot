# Shadow drop-in for the gondroid unit: ~/.config/systemd/user/gondroid.service.d/shadow.conf
# Nothing is sent to Telegram and nothing written to the brain (captured under ~/gondroid/shadow);
# the old deployment tees its updates to http://<host>:8772/telegram. Remove this file, then
# daemon-reload and restart gondroid, to cut over (long polling takes the bot token).
[Service]
Environment=TELEGRAM_SHADOW=1
