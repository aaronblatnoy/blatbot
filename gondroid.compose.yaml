# Gondroid: the Definite Optimists team's Telegram ledger. It writes every message in its chats to
# the Definite Optimists brain and answers questions from it, in the chat where it was asked.
# Nothing else: no email, phone, tools, timers or local memory. Deployed on black-sky as the
# Coolify application "gondroid" (Definite Optimists team). Secrets come from the Coolify
# application's environment, never from this file.
services:
  gondroid:
    build:
      context: .
      dockerfile: deploy/gondroid/Dockerfile
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OWNER_TELEGRAM_ID=${GATE_APPROVER_TELEGRAM_ID}
      - GONDROID_ALLOWED_USER_IDS=${GONDROID_ALLOWED_USER_IDS:-}
      - DO_BRAIN_KEY=${DO_BRAIN_KEY}
      - DO_BRAIN_API_URL=https://definite-optimists-brain.aaronblatnoy.workers.dev
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - LEDGER_MODEL=sonnet
    volumes:
      - gondroid-data:/data

volumes:
  gondroid-data:
