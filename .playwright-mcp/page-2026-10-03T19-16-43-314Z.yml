                - paragraph [ref=f8e178]: "DC Hub is the live data layer for data-center site selection. Agents can query it and cite it. It covers 330,000+ mapped power, grid, gas and fiber assets. It scores 300+ markets daily with the Data Center Power Index (DCPI), and it carries live grid feeds from the seven US ISOs (PJM, ERCOT, CAISO, MISO, SPP, NYISO, ISO-NE), plus retail and wholesale electricity prices by state and ISO. Answers carry an as-of timestamp and a citation line. The server has 92 MCP tools at https://dchub.cloud/mcp plus a REST API at https://dchub.cloud/api/v1. The free tier needs no key; a $10 one-time pack adds 1,000 API credits. Capacity Source adds a free capacity marketplace: operators list data-center capacity at https://dchub.cloud/listings, and agents search it by size and location with sourcecapacity, then request an introduction with requestcapacity_intro."
