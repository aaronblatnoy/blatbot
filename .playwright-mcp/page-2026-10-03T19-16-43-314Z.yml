                  - img "Verified" [ref=f8e358]
                - generic [ref=f8e359]: 972 uses
                - paragraph [ref=f8e362]: Help your agent research AI products and MCP servers for a task. Find candidates, inspect their capabilities and evidence, and compare available pricing. Start with searchproviders, open the strongest matches with getproviderprofile, then use compareproviders. Public reads need no account at the direct endpoint. Coverage and pricing availability vary.
