                - paragraph [ref=f8e142]: "DevMatch is an MCP server for hiring engineers based on what they've actually built. Connect from Cursor, Claude Desktop, or any MCP-compatible AI assistant and search 35M+ developers ranked by verified open-source contributions — not LinkedIn keywords or self-reported skills. Three tools: findcandidates — paste a job description, get a ranked shortlist with bio, top repos, contribution evidence, and contact info. Pro tier adds verified email enrichment on the top 5 results. getprofile — deep-dive any GitHub handle. Bio, recent activity, top projects, and outreach channels in one call. findsimilarprojects — landscape mapping from a seed repo with top contributors surfaced, so you can pivot from a project to its maintainers in one step. Built for mission-driven teams that want engineers who care about the work, not just check the keyword box. OAuth sign-in (no API keys to juggle). Free tier with 50 monthly credits, $129/mo Pro for higher quotas plus verified email enrichment."
