          - listitem [ref=f8e368] [cursor=pointer]:
            - generic [ref=f8e370]:
              - img "reportflow-mcp" [ref=f8e372]
              - generic [ref=f8e373]:
                - generic [ref=f8e374]:
                  - heading "reportflow-mcp" [level=3] [ref=f8e375]
                  - img "Verified" [ref=f8e376]
                - generic [ref=f8e377]: 869 uses
                - paragraph [ref=f8e380]: "An MCP (Model Context Protocol) server that turns your ReportFlow templates into PDF reports — invoices, contracts, statements, anything you've designed — straight from Claude or any other MCP-compatible AI agent. What it does Generate PDFs from natural-language requests like \"create an invoice for Acme Corp totalling $300\" Expose your ReportFlow designs and their parameter schemas directly to the AI as MCP Resources Bulk-generate many PDFs and download them as a single ZIP Save outputs to whichever workspace folder the user is currently in (Claude Desktop / Claude Code / Cursor / VS Code all supported) Setup Claude Desktop / Claude Code / Cursor Add the following to your config file (.mcp.json, claudedesktopconfig.json, ~/.cursor/mcp.json, etc.): { \"mcpServers\": { \"reportflow\": { \"command\": \"npx\", \"args\": [\"-y\", \"reportflow-mcp\"] } } } That's the whole setup. No env vars, no API keys, no secrets to manage. VS Code (MCP-enabled builds) Same JSON in .vscode/mcp.json. Requirements Node.js 18+ (auto-fetched by npx) A local environment with a browser (only required during the first login) A ReportFlow account Usage First-run authentication After reloading the MCP client, ask the AI: Authenticate with ReportFlow A browser window opens. Sign in → pick a workspace → consent, and you're done. Tokens are stored in your OS keychain (macOS Keychain / Windows Credential Manager / Linux libsecret) and refreshed automatically. Generate a PDF Natural language (easiest) Using the invoice template, create a PDF for Acme Corp totalling $330. The AI will look up the template via listtemplates, fetch its parameter schema with getdesignparameters, fill in the values, and call generatepdfsync — returning a local file path. Slash commands Command Purpose /generatepdf Step-by-step recipe for a single PDF /generatepdfs Recipe for batch PDF generation /reportflowhelp Quick feature tour Where files are saved Output location is resolved in this order: Explicit instruction from the user (e.g. \"save to my Desktop\") The currently-open workspace root (Claude Code / Cursor / VS Code) The OS temp directory as fallback Reference Tools (called by the AI) Tool Purpose authenticate First-time / re-authentication listtemplates List available designs getdesignparameters Fetch the parameter schema for a design generatepdfsync / async Generate one PDF (sync returns path; async returns request ID) generatepdfssync / async Generate many PDFs (returns a ZIP) downloadfile / downloadzip Download artifacts produced by async tools suggestparams Translate a natural-language brief into a params JSON via MCP Sampling (requires a Sampling-capable client) Resources (attachable as AI context) URI Contents reportflow://designs List of available designs reportflow://designs/{designId}/parameters Parameter schema for one design reportflow://errors Catalog of error messages from the Content Service reportflow://server-info Server feature overview Prompts (slash-command recipe cards) /generatepdf, /generatepdfs, /reportflowhelp — pass arguments and the AI follows the prepared workflow. Troubleshooting Symptom Fix Error containing re-authentication required Ask the AI: \"re-authenticate with ReportFlow\" npx cannot find the package npm cache clean --force then retry No keychain available on Linux Falls back automatically to a chmod-0600 file under $XDGSTATE_HOME/reportflow-mcp/ Browser cannot open over SSH / remote shell Authenticate once on a local machine; afterwards the cached token works on remote hosts License MIT — see LICENSE. Links ReportFlow: https://re-port-flow.com npm: https://www.npmjs.com/package/reportflow-mcp Issues: https://github.com/re-port-flow/reportflow-mcp/issues"
