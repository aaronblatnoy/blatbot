            - heading [level=2] [ref=e91]:
              - strong [ref=e92]: Our Mission
            - paragraph [ref=e93]: The Stern Real Estate Group aims to foster a greater understanding of the real estate industry for students through professional resources, networking, and mentorship.
          - separator [ref=e98]
          - heading [level=2] [ref=e104]:
            - strong [ref=e105]: Events We Host
          - generic [ref=e110]:
            - heading "Weekly Speakers" [level=3] [ref=e111]
            - paragraph [ref=e112]: Every Monday, SREG hosts a real estate professional, typically an alumnus, to discuss his/her education, career experience, and view of the market. Students also get the chance to speak directly with these real estate experts.
            - heading "Workshops" [level=3] [ref=e113]
            - paragraph [ref=e114]: SREG hosts technical real estate workshops throughout the year, including but not limited to basic RE terminology and concepts, ARGUS training courses, and elementary to advanced Excel modeling classes.
          - generic [ref=e119]:
            - heading "Site Tours" [level=3] [ref=e120]
            - paragraph [ref=e121]: Working with real estate developers and owners, SREG arranges private site tours for our members to learn more about top real estate firms in person, interact with professionals, and explore development projects.
            - heading "Networking Events" [level=3] [ref=e122]
            - paragraph [ref=e123]: SREG frequently organizes networking events for students to begin building their networks. Our annual RE Alumni Mingle hosts 120+ students and alumni, while private corporate events allow students to meet professionals.
