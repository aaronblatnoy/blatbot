  web:
    description: search the public web and open web pages, only when the answer lives OUTSIDE Aaron's own systems
      (a person's LinkedIn or employer, an outside club's leadership, news, a public page). Not for anything in
      TAMID/SJBA Drive, sheets, forms, calendars, inboxes or the club websites' admin backends.
    read: true
    tools:
    - WebSearch
    - mcp__playwright__browser_search
    - mcp__playwright__browser_navigate
    - mcp__playwright__browser_snapshot
    - mcp__playwright__browser_find
    - mcp__playwright__browser_wait_for
    - mcp__playwright__browser_navigate_back
  host_read:
    description: 'see what is running on the server Blatbot itself runs on (black-sky): containers, services, uptime,
      disk, memory, GPUs. Read-only status only; no commands, no changes.'
    read: true
    tools:
    - mcp__host__host_status
  browser_read:
    description: 'read a public web page in a headless browser (navigate, snapshot, find, screenshot), for things
      that are only online and not in Aaron''s own systems. Read-only: no clicking, typing or form filling.'
    read: true
    tools:
    - mcp__playwright__browser_search
    - mcp__playwright__browser_navigate
    - mcp__playwright__browser_navigate_back
    - mcp__playwright__browser_snapshot
    - mcp__playwright__browser_find
    - mcp__playwright__browser_take_screenshot
    - mcp__playwright__browser_wait_for
    - mcp__playwright__browser_tabs
    - mcp__playwright__browser_resize
    - mcp__playwright__browser_console_messages
    - mcp__playwright__browser_network_requests
    - mcp__playwright__browser_close
  browser_act:
    description: operate a headless browser like a person (click, type, fill and submit forms, select options, upload,
      dialogs) for something that can only be done through a website's own UI and has no tool of its own. Last resort,
      never the first choice when a Drive, calendar, inbox, contacts or site-admin tool covers it. Includes browser_read.
    read: false
    tools:
    - mcp__playwright__browser_search
    - mcp__playwright__browser_navigate
    - mcp__playwright__browser_navigate_back
    - mcp__playwright__browser_snapshot
