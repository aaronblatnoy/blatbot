version: 1
where_things_live:
- 'TAMID applicants, interviews, interview schedules, coffee chats, rosters, forms, board availability: the TAMID
  workspace (sheets, forms, Gmail) and the TAMID calendar. Never the public web.'
- 'TAMID and SJBA board members, their roles, positions and titles, bios, headshots, club events, contact-form
  submissions: the club website admin (the board list there states each person''s position). Never the public
  web, never a browser.'
- 'Aaron''s own schedule and his own mail: his Stern account, not the TAMID calendar.'
- 'Aaron''s classes, assignments, grades, due dates: NYU Brightspace.'
- 'TAMID''s posts, followers, post performance: TAMID social (Instagram, LinkedIn). Website traffic configuration:
  TAMID analytics.'
- 'Deployed apps, containers managed by Coolify, deployments and their logs: Coolify. What is running on the box
  itself at the OS level: the server.'
- 'The public web is only for things outside Aaron''s systems: other organizations, people''s public profiles, articles,
  general facts.'
- A task that only reads never needs a write capability; a task that changes something needs the write capability
  of that system, not a browser.
- '''black sky'' / ''black-sky'' is the server: containers, services, uptime. Not the web.'
- 'What Aaron has written down for himself (notes on his projects, people, decisions, preferences, how something
  was set up, daily notes): his second brain, the Obsidian vault. Not Drive, not the public web.'
- 'US pension and benefit plans, their Form 5500 filings, plan assets, trustees, investment managers, consultants
  and other service providers: the pension filings database (public Department of Labor data). Not the public web.'
systems:
  second_brain:
    description: 'Aaron''s second brain (''the vault'', ''Obsidian'', ''my notes''): his own markdown notes on projects,
      areas, people, decisions, preferences, reference material and daily notes. Not Google Drive, not an inbox,
      not the public web.'
    always:
    - vault_read
    leaves: {}
  tamid_workspace:
    description: 'TAMID''s Google Drive, Sheets, Docs, Forms or the TAMID Gmail inbox ({ORG_ACCOUNT}): rosters,
      schedules, trackers, applications, form responses, emails TAMID sent or received.'
    always:
    - tamid_drive_read
    leaves:
      tamid_write:
        question: 'Change something in TAMID Drive: write cells, append rows, create a sheet, doc, form or folder.'
        grants:
        - tamid_drive_write
  tamid_calendar:
    description: 'The TAMID club Google Calendar ({ORG_ACCOUNT}; where TAMID interviews and club events live;
      NOT Aaron''s own calendar, which is his Stern account): event times, free/busy, creating, moving or cancelling
      events.'
    always:
    - calendar
    leaves: {}
  aaron_stern:
    description: 'Aaron''s own NYU Stern account: his personal calendar (''my calendar'') or his Stern Gmail (''my
      email'').'
    always: []
    leaves:
      stern_calendar:
        question: 'Aaron''s Stern calendar: his events, free/busy, creating or changing his events.'
        grants:
        - stern_calendar
      stern_email:
        question: 'Aaron''s Stern Gmail: search or read his messages.'
        grants:
        - stern_email_read
  blatbot_inkbox:
    description: 'Blatbot''s own mailbox, phone line and address book: its email, SMS and iMessage threads, sending
      a message to a third party, contact records and notes.'
    always: []
    leaves:
      inkbox_read:
        question: Read Blatbot's own email, text or iMessage threads.
        grants:
        - inbox_read
      contacts:
        question: Look up, create or update a contact or its notes in Blatbot's address book.
        grants:
        - contacts
      send_email:
        question: Send an email to someone other than the requester.
        grants:
        - email_send
      send_sms:
        question: Send an SMS text to someone other than the requester.
        grants:
        - sms_send
      send_imessage:
        question: Send an iMessage to someone other than the requester.
        grants:
        - imessage_send
  club_websites:
    description: 'The TAMID at NYU or SJBA website admin: board members and bios, events, members, site settings,
      contact-form submissions, newsletter signups.'
    always: []
    leaves:
      tamid_site_read:
        question: Read the TAMID at NYU website admin.
        grants:
        - tamid_site_read
      tamid_site_write:
        question: 'Change the TAMID at NYU website: create, update, delete, replace an image.'
        grants:
        - tamid_site_write
        - tamid_site_read
      sjba_site_read:
        question: Read the SJBA website admin.
        grants:
        - sjba_site_read
      sjba_site_write:
        question: 'Change the SJBA website: create, update, delete, replace an image.'
        grants:
        - sjba_site_write
        - sjba_site_read
  public_web:
    description: 'The public internet, for facts that live OUTSIDE Aaron''s own systems: another organization''s
      site, a person''s public profile, an article, a general fact. Not for anything in TAMID or SJBA sheets, forms,
      calendars, inboxes or website admin.'
    always:
    - web
    leaves:
      browser_read:
        question: Open and read a specific web page in a browser (beyond a search result list).
        grants:
        - browser_read
      browser_act:
        question: 'Operate a web page like a person: click, type, fill or submit a form, log in.'
        grants:
        - browser_act
        - browser_read
  server:
    description: 'The black-sky server Blatbot runs on (''black sky'', ''the server'', ''the box''): what is running,
      containers, services, the gateway, uptime, disk, memory, GPUs.'
    always:
    - host_read
    leaves: {}
  telegram_account:
    description: 'Aaron''s own Telegram account (his personal account, not Blatbot''s bot): his groups, channels
      and DMs. Read-only here: finding a chat, listing chats, reading messages.'
    always:
    - telegram_read
    leaves: {}
  tamid_social:
    description: 'TAMID''s Instagram or LinkedIn accounts: what was posted, how posts performed, followers, drafting
      or publishing a post.'
    always: []
    leaves:
      instagram_read:
        question: 'Read TAMID''s Instagram: account, recent posts, insights, audience, or check a caption.'
        grants:
        - tamid_instagram_read
      instagram_post:
        question: Stage or publish a post on TAMID's Instagram.
        grants:
        - tamid_instagram_post
        - tamid_instagram_read
      linkedin_read:
        question: Read TAMID's LinkedIn account or check post text.
        grants:
        - tamid_linkedin_read
      linkedin_post:
        question: Stage, publish or delete a post on TAMID's LinkedIn.
        grants:
        - tamid_linkedin_post
        - tamid_linkedin_read
  tamid_analytics:
    description: 'TAMID''s Google Analytics property (the website''s traffic analytics configuration): custom dimensions
      and metrics, key events, data streams, retention, user access.'
    always:
    - tamid_analytics_read
    leaves:
      analytics_write:
        question: 'Change the Analytics property: create, update, archive or delete a dimension, metric, key event,
          stream, or user access.'
        grants:
        - tamid_analytics_write
  nyu_brightspace:
    description: 'Aaron''s NYU Brightspace (the university''s course site), and the authority on
      anything to do with his classes: courses, assignments, deliverables, projects, memos, papers,
      problem sets, exams, quizzes, due dates and times, grades, announcements, discussions, course
      content and syllabi. Any question about school work, what is due, or when something is due,
      is answered here. A syllabus found in a drive is a stale copy; Brightspace overrides it.'
    always:
    - brightspace_read
    leaves:
      brightspace_act:
        question: 'Act inside Brightspace: submit an assignment, post or reply in a discussion, mark content complete,
          create a calendar event, pin a course.'
        grants:
        - brightspace_act
  coolify:
    description: 'Aaron''s Coolify deployments (self-hosted PaaS): the apps, databases and services running on the
      black-sky Coolify and the Vox Coolify, their deployments, logs, env vars, health.'
    always: []
    leaves:
      coolify_read:
        question: 'Read the black-sky Coolify: apps, services, databases, deployments, logs, health.'
        grants:
        - coolify_read
      coolify_control:
        question: 'Change the black-sky Coolify: deploy, restart, stop, start, edit env vars.'
        grants:
        - coolify_control
        - coolify_read
      vox_read:
        question: Read the Vox Coolify instance.
        grants:
        - coolify_vox_read
      vox_control:
        question: 'Change the Vox Coolify instance: deploy, restart, stop, env vars.'
        grants:
        - coolify_vox_control
        - coolify_vox_read
  pension_filings:
    description: 'The pension filings database: public US Department of Labor Form 5500 annual reports for
      private-sector pension and benefit plans (plan years 2023 and 2024). Plans, sponsors, assets, participants,
      investment managers, consultants, custodians, fees, manager changes and plan events. Read-only. No state or city pension funds, no private or client data.'
    always:
    - pension_filings_read
    leaves: {}
  corgi_crm:
    description: 'Corgi Command, the Corgi NYC pension-fund CRM for the ANOS growth mandate (''corgi'', ''the
      CRM'', ''bigdough'', ''corgiiq''): ranked pension funds, recommended targets, fund contacts, signals, the
      outreach log, poaching/recruiting records, prospect lists, tasks and the transition-manager call list.
      Not the pension filings database (public DOL Form 5500 data) and not the public web.'
    always:
    - corgi_read
    leaves:
      corgi_write:
        question: 'Change something in Corgi Command: log or edit outreach, add or update a user, ingest lead-gen,
          update or import prospects, work a poaching/recruiting record, post or action a task, or touch the
          transition-manager call list.'
        grants:
        - corgi_write
  coolify_corgi:
    description: 'The Corgi NYC Coolify instance (ANOS/Corgi deployments), separate from black-sky''s own Coolify
      and the Vox Coolify.'
    always: []
    leaves:
      coolify_corgi_read:
        question: Read the Corgi NYC Coolify.
        grants:
        - coolify_corgi_read
      coolify_corgi_control:
        question: 'Change the Corgi NYC Coolify: deploy, restart, stop, start, edit env vars.'
        grants:
        - coolify_corgi_control
        - coolify_corgi_read
  dol_filings:
    description: 'dol-mcp: the Department of Labor Form 5500 public filing data server (local SQLite copy on
      black-sky). Related to, but a separate server from, pension_filings (the Postgres-backed copy with signals).
      Use this one when asked for dol-mcp or dol_ specifically; otherwise prefer pension_filings.'
    always:
    - dol_read
    leaves:
      dol_sync:
        question: Refresh the local Form 5500 data from the Department of Labor's public bulk data.
        grants:
        - dol_sync

