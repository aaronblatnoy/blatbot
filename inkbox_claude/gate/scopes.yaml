    read: true
    server: tamid-instagram
    include:
    - ig_account
    - ig_recent_posts
    - ig_check_caption
    - ig_publish_limit
    - ig_account_insights
    - ig_post_insights
    - ig_audience
  tamid_instagram_post:
    description: stage and publish posts on TAMID's Instagram (publishing is public and needs Aaron's yes)
    read: false
    server: tamid-instagram
    include:
    - ig_stage_post
    - ig_publish_post
  tamid_linkedin_read:
    description: read TAMID's LinkedIn account and check post text
    read: true
    server: tamid-linkedin
    include:
    - li_account
    - li_check_text
  tamid_linkedin_post:
    description: stage, publish and delete posts on TAMID's LinkedIn (publishing is public and needs Aaron's yes)
    read: false
    server: tamid-linkedin
    include:
    - li_stage_post
    - li_publish_post
    - li_delete_post
  tamid_analytics_read:
    description: 'read TAMID''s Google Analytics property configuration: dimensions, metrics, key events, streams,
      retention, access'
    read: true
    server: analytics-admin
    include:
    - ga_list_*
    - ga_get_*
  tamid_analytics_write:
    description: 'change TAMID''s Google Analytics property: create, update, archive, delete, grant or revoke'
    read: false
    server: analytics-admin
    include:
    - ga_*
    exclude:
    - ga_list_*
    - ga_get_*
  brightspace_read:
    description: 'read Aaron''s NYU Brightspace: courses, assignments, due dates, grades, announcements, quizzes,
      discussions, content, notifications'
    read: true
    server: brightspace
    include:
    - bs_list_*
    - bs_get_*
    - bs_my_*
    - bs_whats_due
    - bs_overdue_items
    - bs_unread_counts
    - bs_notifications
    - bs_final_grade
    - bs_quiz_attempts
    - bs_assignment_feedback
    - bs_content_*
    - bs_course_overview
    - bs_calendar_events
    - bs_search_content
    - bs_user_profile
    - bs_whoami
    - bs_auth_status
    - bs_classlist
  brightspace_act:
    description: 'act in Aaron''s NYU Brightspace: submit an assignment, post or reply in a discussion, mark complete,
      create a calendar event, pin a course, dismiss an announcement (submitting and posting need Aaron''s yes)'
    read: false
    server: brightspace
    include:
    - bs_submit_assignment
    - bs_post_discussion
    - bs_reply_discussion
    - bs_mark_*
    - bs_pin_course
    - bs_dismiss_announcement
    - bs_create_calendar_event
    - bs_download_*
  coolify_read:
    description: 'read the black-sky Coolify: infrastructure overview, apps, services, databases, deployments, logs,
      env var names, health, docs'
