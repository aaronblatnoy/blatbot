[project]
name = "claude-code-plugin"
version = "0.2.10"
description = "Inkbox bridge for Claude Code — talk to your coding agent over email, SMS, iMessage, and voice"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
  "aiohttp>=3.9",
  "inkbox>=0.7.29,<1.0.0",
  "claude-agent-sdk>=0.1.0",
  "segno>=1.5",  # terminal QR codes for the iMessage connect step
  "langgraph>=1.0",  # the Jev agent's state graph (gate/jevgraph.py)
  # Reading files sent in chats (chatfiles.py, via deploy/gondroid/gondroid.py's extract)
  "pypdf>=5.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pypdfium2>=4.30",
  "pillow>=11.0",
  "pillow-heif>=0.21",
  "fonttools>=4.50",  # render_image: <text> in a bundled font becomes exact outlines (gate/imagetool.py)
]

[project.scripts]
inkbox-claude = "inkbox_claude.cli:main"

[tool.setuptools.packages.find]
include = ["inkbox_claude*"]

[tool.setuptools.package-data]
# Ship the bundled Claude Code avatar attached to agents during setup.
inkbox_claude = ["assets/*.png", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
